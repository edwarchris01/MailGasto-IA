name: mailgasto
description: Consulta de gastos registrados desde avisos bancarios.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.5
  flutter: '>=3.41.9'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.0.0
  dio: ^5.11.1
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^11.2.0
  go_router: ^17.2.3
  intl: ^0.20.2
  crypto: ^3.0.7
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand.png
