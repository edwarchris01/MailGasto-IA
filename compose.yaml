services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mailgasto
      POSTGRES_DB: mailgasto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailgasto -d mailgasto"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://mailgasto:${POSTGRES_PASSWORD}@db:5432/mailgasto
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
      integration:
        aliases: [mailgasto-api]
networks:
  integration:
    name: ${MAILGASTO_NETWORK:-mailgasto-integration}
volumes:
  pgdata:
